# =====================================================================
# heart-pilot 应用层（服务器版·产物模式）
# 中间件复用 lp-infra：Postgres(pgvector) / Redis(db2) / MinIO
#
# 服务器只 COPY 本机编译好的 jar / dist（Dockerfile.deploy），不装 Maven/npm、
# 不下载依赖，镜像重建通常 10~30 秒。
#   标准做法：本机跑 .\deploy.cmd（编译 + 上传 + 服务器重建 + 重启 + 健康检查）
#   服务器手动：bash deploy/server/redeploy.sh
#
# 本地开发仍用仓库根的 docker-compose.yml（多阶段 Dockerfile，在容器内编译）。
# =====================================================================
name: hp-app

services:
  hp-backend:
    build:
      context: ./heart-pilot-backend
      # 产物模式：只 COPY 本机上传的 target/app.jar
      dockerfile: Dockerfile.deploy
    container_name: hp-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # ---- Postgres（共享实例，库 heart_pilot）----
      DATABASE_URL: jdbc:postgresql://postgres:5432/heart_pilot
      DATABASE_USERNAME: ${PG_USER}
      DATABASE_PASSWORD: ${PG_PASSWORD}
      # ---- Redis（共享实例，用 db2 和另外两个项目隔离）----
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: "2"
      # ---- MinIO（共享实例，桶 heart-pilot）----
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # ---- 业务配置 ----
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://101.201.208.223:8081}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      KNOWLEDGE_SOURCE_DIRECTORY: /app/knowledge
      TZ: Asia/Shanghai
    volumes:
      # 知识库文件（容器里只读），路径与原 application.yml 的 ../knowledge 对齐
      - ./knowledge:/app/knowledge:ro
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    # 镜像里固定 -XX:MaxRAMPercentage=75，640M 约等于 480M 堆（RSS 约 600M）
    mem_limit: 640m
    memswap_limit: 1024m
    networks: [default, shared]

  hp-frontend:
    build:
      context: ./heart-pilot-frontend
      # 产物模式：只 COPY 本机 npm run build 生成的 dist 和 nginx.conf
      dockerfile: Dockerfile.deploy
    container_name: hp-frontend
    restart: unless-stopped
    depends_on:
      hp-backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      # 覆盖镜像内配置：后端服务名改成 hp-backend
      - ./deploy/server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 48m
    networks: [default]

networks:
  default:
  shared:
    external: true
    name: lp-shared
